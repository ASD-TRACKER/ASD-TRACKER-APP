name: Daily Health Check

on:
  schedule:
    - cron: '23 22 * * *'   # 8:23 AM AEST (UTC+10) every day
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI

jobs:
  health-check:
    name: ASD Portal Health Check
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0      # need full history to compare branches

      # ── 2. Node setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 3. Build check ─────────────────────────────────────────────────────
      - name: Build check
        run: |
          echo "Running production build..."
          npm run build
          echo "✅ Build passed"

      # ── 4. Feature integrity ────────────────────────────────────────────────
      - name: Feature integrity check
        run: |
          echo "Checking 10 key feature patterns in asd-app.jsx..."
          echo ""
          FAILED=0

          check() {
            local pattern="$1"
            local label="$2"
            if grep -q "$pattern" asd-app.jsx; then
              echo "  ✅  $label"
            else
              echo "  ❌  $label  ← MISSING"
              FAILED=$((FAILED + 1))
            fi
          }

          check "scheduleCompletedBy"       "Scheduled & Completed status"
          check "smartRemoveCalendarEvent"  "Protected scheduled event deletion"
          check "pendingDeleteEventId"      "Delete confirmation dialog"
          check "incomingDate"              "Incoming date on projects"
          check "calendarViewMember"        "Team inbox switching"
          check "isPastDay"                 "Past-date blocking"
          check "canActForOthers"           "Admin scheduling on behalf of others"
          check "todayYmd"                  "Live date function (not stale TODAY)"
          check "Victoria"                  "Victoria address bias"
          check "copiedTrackerAddr"         "Copy address from Tracker tab"

          echo ""
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED feature(s) missing from source — possible regression"
            exit 1
          else
            echo "✅ All 10 features present"
          fi

      # ── 5. Branch sync ──────────────────────────────────────────────────────
      - name: Branch sync check (main vs gh-pages)
        run: |
          git fetch origin gh-pages
          MAIN_TS=$(git log -1 --format="%ct" origin/main)
          GHPAGES_TS=$(git log -1 --format="%ct" origin/gh-pages)
          MAIN_DATE=$(git log -1 --format="%ci" origin/main)
          GHPAGES_DATE=$(git log -1 --format="%ci" origin/gh-pages)
          MAIN_MSG=$(git log -1 --format="%s" origin/main)
          GHPAGES_MSG=$(git log -1 --format="%s" origin/gh-pages)

          echo "main:     $MAIN_DATE  —  $MAIN_MSG"
          echo "gh-pages: $GHPAGES_DATE  —  $GHPAGES_MSG"

          # gh-pages deploy happens after main commit; allow up to 24 h lag
          THRESHOLD=$(( MAIN_TS - 86400 ))
          if [ "$GHPAGES_TS" -lt "$THRESHOLD" ]; then
            echo ""
            echo "❌ BRANCH SYNC MISMATCH"
            echo "   gh-pages is more than 24 h behind main — a deploy was likely missed."
            echo "   Fix: copy dist/* to the gh-pages worktree, commit, and push."
            exit 1
          else
            echo "✅ Branches in sync (gh-pages within 24 h of main)"
          fi

      # ── 6. Source file size sanity check ────────────────────────────────────
      - name: Source file size check
        run: |
          SIZE=$(wc -l < asd-app.jsx)
          echo "asd-app.jsx is $SIZE lines"
          if [ "$SIZE" -lt 5000 ]; then
            echo "❌ Source file suspiciously small ($SIZE lines) — possible truncation"
            exit 1
          else
            echo "✅ Source file size normal"
          fi

      # ── 7. Summary (only on full pass) ──────────────────────────────────────
      - name: Print summary
        if: success()
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          echo ""
          echo "================================================="
          echo "  ASD PORTAL — DAILY HEALTH CHECK PASSED"
          echo "  $DATE"
          echo "-------------------------------------------------"
          echo "  ✅ Build          clean"
          echo "  ✅ Features (10)  all present"
          echo "  ✅ Branch sync    main = gh-pages"
          echo "  ✅ Source file    size normal"
          echo "================================================="

      # ── 8. Notify on failure ────────────────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          echo ""
          echo "================================================="
          echo "  ❌ ASD PORTAL HEALTH CHECK FAILED"
          echo "  Check the steps above for what failed."
          echo "  GitHub will email the repo owner automatically."
          echo "================================================="
